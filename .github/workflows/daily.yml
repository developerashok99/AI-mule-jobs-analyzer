name: Daily MuleSoft job-hunt pipeline

on:
  schedule:
    - cron: "30 3 * * *"  # ~9:00 AM IST
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore job database
        uses: actions/cache@v4
        with:
          path: data
          key: jobs-db-${{ github.run_id }}
          restore-keys: jobs-db-

      - name: Run daily pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.main

      - name: Commit updated data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/lecture_qna data/lecture_qna_cache.json
          git diff --cached --quiet || git commit -m "Update generated interview Q&A [skip ci]"
          git push
